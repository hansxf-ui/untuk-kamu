<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pw: min(43vw, 290px);
    --ph: calc(var(--pw) * 1.52);
    --pink: #ff8fab;
    --pink-deep: #e75480;
    --paper: #fffaf3;
    --ink: #4a3038;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', sans-serif;
    background-color: #ffd3e4;
    background-image:
      radial-gradient(rgba(255,255,255,.85) 11%, transparent 12%),
      radial-gradient(rgba(255,255,255,.85) 11%, transparent 12%);
    background-size: 92px 92px;
    background-position: 0 0, 46px 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .hati {
    position: fixed;
    font-size: 26px;
    opacity: .45;
    animation: melayang 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes melayang {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-22px) rotate(8deg); }
  }
  .judul-atas {
    font-family: 'Patrick Hand', cursive;
    color: #a4133c;
    font-size: clamp(20px, 5.4vw, 30px);
    margin-bottom: 18px;
    text-shadow: 0 2px 0 rgba(255,255,255,.7);
    z-index: 2;
    text-align: center;
    padding: 0 16px;
  }
  .panggung { z-index: 2; }
  .bayangan {
    width: min(62vw, 430px); height: 22px;
    margin: 20px auto 0;
    background: radial-gradient(ellipse at center, rgba(164,19,60,.32), transparent 68%);
    border-radius: 50%;
    z-index: 1;
  }
  .buku {
    position: relative;
    width: calc(var(--pw) * 2);
    height: var(--ph);
    transition: transform .85s cubic-bezier(.25,.8,.3,1);
    cursor: pointer;
    user-select: none;
  }
  .slot { position: absolute; top: 0; width: var(--pw); height: var(--ph); }
  #slotKiri { left: 0; }
  #slotKanan { left: 50%; }
  .daun {
    position: absolute; top: 0; width: var(--pw); height: var(--ph);
    display: none; z-index: 30; will-change: transform;
  }
  .daun.kanan { left: 50%; transform-origin: left center; }
  .daun.kiri { left: 0; transform-origin: right center; }
  #daunDalam { position: absolute; inset: 0; }
  .daun-bayang { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .daun.kanan .daun-bayang { background: linear-gradient(90deg, rgba(90,30,45,.22), transparent 60%); }
  .daun.kiri .daun-bayang { background: linear-gradient(270deg, rgba(90,30,45,.22), transparent 60%); }
  .muka {
    overflow: hidden;
    background: var(--paper);
    padding: calc(var(--pw) * .11);
    display: flex; flex-direction: column;
  }
  .muka.depan {
    border-radius: 6px calc(var(--pw) * .05) calc(var(--pw) * .05) 6px;
    box-shadow: inset 22px 0 28px -22px rgba(90, 30, 45, .35);
  }
  .muka.belakang {
    border-radius: calc(var(--pw) * .05) 6px 6px calc(var(--pw) * .05);
    box-shadow: inset -22px 0 28px -22px rgba(90, 30, 45, .35);
  }
  .muka h2 {
    font-family: 'Patrick Hand', cursive;
    color: var(--pink-deep);
    font-size: calc(var(--pw) * .118 * var(--fp, 1));
    margin-bottom: calc(var(--pw) * .06);
    line-height: 1.15;
  }
  .muka p {
    font-size: calc(var(--pw) * .078 * var(--fp, 1));
    line-height: 1.5;
    color: var(--ink);
    font-weight: 500;
  }
  .nomor {
    position: absolute;
    bottom: calc(var(--pw) * .06);
    font-size: calc(var(--pw) * .055);
    color: #b98a97;
    font-weight: 700;
  }
  .depan .nomor { right: calc(var(--pw) * .09); }
  .belakang .nomor { left: calc(var(--pw) * .09); }
  /* --- sampul --- */
  .sampul {
    background: linear-gradient(150deg, #ffb3c9 0%, var(--pink) 55%, var(--pink-deep) 130%);
    align-items: center;
    text-align: center;
    justify-content: flex-start;
  }
  .pita {
    position: absolute; top: 0; left: 0; right: 0; height: calc(var(--pw) * .07);
    background: repeating-linear-gradient(45deg, #e63946 0 16px, #ffffff 16px 32px);
    opacity: .9;
  }
  .sampul .isi-sampul { margin: auto 0; }
  .sampul .kecil {
    font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    font-size: calc(var(--pw) * .055); color: rgba(255,255,255,.9);
  }
  .sampul h1 {
    font-family: 'Patrick Hand', cursive;
    color: #fff;
    font-size: calc(var(--pw) * .225);
    line-height: 1.05;
    text-shadow: 0 3px 0 rgba(164,19,60,.25);
    margin: calc(var(--pw) * .04) 0;
  }
  .sampul .sub {
    color: rgba(255,255,255,.95);
    font-size: calc(var(--pw) * .075);
    line-height: 1.5;
    font-weight: 600;
  }
  .petunjuk {
    margin-top: auto;
    margin-bottom: calc(var(--pw) * .05);
    color: #fff;
    font-weight: 700;
    font-size: calc(var(--pw) * .07);
    animation: denyut 1.6s ease-in-out infinite;
  }
  @keyframes denyut { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .sampul-belakang {
    background: linear-gradient(210deg, #ffb3c9, var(--pink) 60%, var(--pink-deep) 140%);
    align-items: center; text-align: center; justify-content: center;
  }
  .sampul-belakang .hati-besar { font-size: calc(var(--pw) * .3); }
  .sampul-belakang p {
    color: rgba(255,255,255,.95); font-weight: 600;
    font-size: calc(var(--pw) * .075); line-height: 1.55; margin-top: calc(var(--pw) * .05);
  }
  .kontrol {
    margin-top: 16px;
    display: flex; align-items: center; gap: 16px;
    z-index: 2;
  }
  .kontrol button {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #a4133c;
    background: #fff;
    border: 2px solid #ffb3c9;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(164,19,60,.15);
    transition: transform .15s ease;
  }
  .kontrol button:active { transform: scale(.94); }
  .kontrol button:disabled { opacity: .35; cursor: default; }
  .indikator {
    font-weight: 700; color: #a4133c; font-size: 14px;
    min-width: 128px; text-align: center;
  }
  .kaki {
    margin-top: 14px;
    padding: 0 18px;
    text-align: center;
    max-width: 100vw;
    color: rgba(164,19,60,.55);
    font-size: 12.5px; font-weight: 600;
    z-index: 2;
  }
</style>
</head>
<body>

<span class="hati" style="top:9%; left:7%;">🤍</span>
<span class="hati" style="top:14%; right:9%; animation-delay:-2s;">💕</span>
<span class="hati" style="bottom:12%; left:11%; animation-delay:-4s;">💕</span>
<span class="hati" style="bottom:18%; right:7%; animation-delay:-1s;">🤍</span>
<span class="hati" style="top:44%; left:3%; animation-delay:-3s; font-size:19px;">✨</span>
<span class="hati" style="top:38%; right:4%; animation-delay:-5s; font-size:19px;">✨</span>

<div class="judul-atas">ada sesuatu buat kamu… buka pelan-pelan ya 🤍</div>

<div class="panggung">
  <div class="buku" id="buku">
    <div class="muka slot" id="slotKiri"></div>
    <div class="muka slot" id="slotKanan"></div>
    <div class="daun" id="daun">
      <div class="muka" id="daunDalam"></div>
      <div class="daun-bayang" id="daunBayang"></div>
    </div>
  </div>
</div>
<div class="bayangan"></div>

<div class="kontrol">
  <button id="btnBalik">← Balik</button>
  <div class="indikator" id="indikator">Sampul</div>
  <button id="btnLanjut">Lanjut →</button>
</div>
<div class="kaki">klik bukunya juga bisa — kanan buat lanjut, kiri buat balik 🤍</div>

<script>
  const WAJAH = [{"kelas": "depan sampul", "html": "\n        <div class=\"pita\"></div>\n        <div class=\"isi-sampul\">\n          <div class=\"kecil\">Sebuah buku kecil</div>\n          <h1>Untuk<br>Kamu</h1>\n          <div class=\"sub\">isinya cuma hal-hal yang<br>nggak pernah sempat<br>aku omongin langsung.</div>\n        </div>\n        <div class=\"petunjuk\">klik buat buka →</div>\n      "}, {"kelas": "belakang", "html": "\n        <h2>Sumpah Ya…</h2>\n        <p>Aku nggak pernah nyangka bisa senyaman ini sama seseorang. Ngobrol berjam-jam nggak kerasa, diam berdua juga nggak canggung.</p>\n        <p style=\"margin-top:.7em;\">Kalau ini mimpi, tolong jangan bangunin dulu.</p>\n        <div class=\"nomor\">1</div>\n      "}, {"kelas": "depan", "html": "\n        <h2>Janji Asli!</h2>\n        <p>Janji bakal selalu angkat teleponmu — jam berapa pun. Janji dengerin ceritamu sampai habis, walau aku udah ngantuk.</p>\n        <p style=\"margin-top:.7em;\">Dan janji nggak bakal pergi cuma gara-gara satu hari yang buruk.</p>\n        <div class=\"nomor\">2</div>\n      "}, {"kelas": "belakang", "html": "\n        <h2>Hal-Hal Kecil</h2>\n        <p>Caramu ketawa sebelum punchline-nya selesai. Caramu bilang “nggak apa-apa” padahal apa-apa.</p>\n        <p style=\"margin-top:.7em;\">Hal kecil buat dunia — hal besar buatku.</p>\n        <div class=\"nomor\">3</div>\n      "}, {"kelas": "depan", "html": "\n        <h2>Makasih Ya</h2>\n        <p>Makasih udah nemenin telepon sampai ketiduran. Makasih udah percaya cerita hal yang nggak kamu ceritain ke siapa-siapa.</p>\n        <p style=\"margin-top:.7em;\">Makasih… udah milih aku, terus-terusan, setiap hari.</p>\n        <div class=\"nomor\">4</div>\n      "}, {"kelas": "belakang", "html": "\n        <h2>Maaf Ya</h2>\n        <p>Maaf kalau kadang aku sibuk sama duniaku sendiri. Maaf kalau perhatianku kadang kalah sama notifikasi HP.</p>\n        <p style=\"margin-top:.7em;\">Aku belajar, pelan-pelan, jadi lebih baik buat kamu.</p>\n        <div class=\"nomor\">5</div>\n      "}, {"kelas": "depan", "html": "\n        <h2>Terakhir…</h2>\n        <p>Bukunya selesai, perasaannya nggak.</p>\n        <p style=\"margin-top:.7em;\">Halaman berikutnya kita tulis bareng-bareng ya — pelan aja, nggak usah buru-buru tamat.</p>\n        <p style=\"margin-top:.9em; font-family:'Patrick Hand',cursive; color:#e75480;\">— dari orang yang paling beruntung karena punya kamu</p>\n        <div class=\"nomor\">6</div>\n      "}, {"kelas": "belakang sampul-belakang", "html": "\n        <div class=\"hati-besar\">🤍</div>\n        <p>buku ini dibuat pakai kode,<br>buat orang yang paling<br>nggak bisa digantiin.</p>\n      "}];
  const buku = document.getElementById('buku');
  const slotKiri = document.getElementById('slotKiri');
  const slotKanan = document.getElementById('slotKanan');
  const daun = document.getElementById('daun');
  const daunDalam = document.getElementById('daunDalam');
  const daunBayang = document.getElementById('daunBayang');
  const indikator = document.getElementById('indikator');
  const btnBalik = document.getElementById('btnBalik');
  const btnLanjut = document.getElementById('btnLanjut');
  const skalaFit = WAJAH.map(() => 1);
  let idx = 0;      // 0 = sampul, 4 = penutup
  let kunci = false; // kunci selama animasi jalan

  function isi(el, i) {
    if (i < 0 || i >= WAJAH.length) { el.style.visibility = 'hidden'; el.innerHTML = ''; return; }
    el.style.visibility = 'visible';
    el.className = (el === daunDalam ? 'muka ' : 'muka slot ') + WAJAH[i].kelas;
    el.innerHTML = WAJAH[i].html;
    el.style.setProperty('--fp', skalaFit[i]);
  }
  function posisiBuku() {
    buku.style.transform = idx === 0 ? 'translateX(-25%)' : idx === 4 ? 'translateX(25%)' : 'translateX(0)';
    indikator.textContent =
      idx === 0 ? 'Sampul' :
      idx === 4 ? 'Penutup 🤍' :
      'Halaman ' + (idx * 2 - 1) + '–' + (idx * 2) + ' dari 6';
    btnBalik.disabled = idx === 0;
    btnLanjut.disabled = idx === 4;
  }
  function gambar() {
    isi(slotKiri, idx * 2 - 1);
    isi(slotKanan, idx * 2);
    posisiBuku();
  }
  function putar(maju) {
    const target = idx + (maju ? 1 : -1);
    if (kunci || target < 0 || target > 4) return;
    kunci = true;
    // Halaman di bawah daun yang akan terungkap:
    if (maju) isi(slotKanan, target * 2); else isi(slotKiri, target * 2 - 1);
    idx = target;
    posisiBuku();
    // Fase 1: daun menyempit ke arah punggung buku
    daun.className = 'daun ' + (maju ? 'kanan' : 'kiri');
    isi(daunDalam, maju ? (target - 1) * 2 : target * 2 + 1);
    daun.style.display = 'block';
    daunBayang.animate([{ opacity: 0 }, { opacity: .55 }], { duration: 400, fill: 'forwards' });
    const f1 = daun.animate(
      [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }],
      { duration: 400, easing: 'ease-in', fill: 'forwards' });
    f1.onfinish = () => {
      // Fase 2: daun melebar di sisi seberang dengan muka berikutnya
      daun.className = 'daun ' + (maju ? 'kiri' : 'kanan');
      isi(daunDalam, maju ? target * 2 - 1 : target * 2);
      daunBayang.animate([{ opacity: .55 }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
      const f2 = daun.animate(
        [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
        { duration: 400, easing: 'ease-out', fill: 'forwards' });
      f2.onfinish = () => { daun.style.display = 'none'; gambar(); kunci = false; };
    };
  }
  const lanjut = () => putar(true);
  const balik = () => putar(false);

  btnLanjut.addEventListener('click', (e) => { e.stopPropagation(); lanjut(); });
  btnBalik.addEventListener('click', (e) => { e.stopPropagation(); balik(); });
  buku.addEventListener('click', (e) => {
    const r = buku.getBoundingClientRect();
    if (e.clientX > r.left + r.width / 2) lanjut(); else balik();
  });
  let sentuhX = null;
  buku.addEventListener('touchstart', (e) => { sentuhX = e.touches[0].clientX; }, { passive: true });
  buku.addEventListener('touchend', (e) => {
    if (sentuhX === null) return;
    const dx = e.changedTouches[0].clientX - sentuhX;
    if (dx < -42) lanjut(); else if (dx > 42) balik();
    sentuhX = null;
  }, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') lanjut();
    if (e.key === 'ArrowLeft') balik();
  });

  // Penyesuai otomatis: ukur tiap muka sekali, pastikan teks muat 100%.
  function ukur() {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed; left:-9999px; top:0; visibility:hidden; width:var(--pw); height:var(--ph);';
    document.body.appendChild(probe);
    WAJAH.forEach((w, i) => {
      probe.className = 'muka ' + w.kelas;
      probe.innerHTML = w.html;
      let s = 1;
      probe.style.setProperty('--fp', 1);
      while (probe.scrollHeight > probe.clientHeight + 1 && s > 0.55) {
        s -= 0.05;
        probe.style.setProperty('--fp', s.toFixed(2));
      }
      skalaFit[i] = s;
    });
    probe.remove();
    gambar();
  }
  gambar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ukur); else ukur();
</script>
</body>
</html>
